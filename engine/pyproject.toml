[project]
name = "cassandra-engine"
version = "0.1.0"
description = "Cassandra MLB player-prop decision engine — point-in-time data, projection, decision, ledger, grading."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "typer>=0.12",
    "python-dateutil>=2.9",
    "tzdata",
]

[project.scripts]
cassandra = "cassandra.cli.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "hypothesis>=6.104",
    "testcontainers[postgres]>=4.7",
    "time-machine>=2.14",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "bandit[toml]>=1.7",
    "pip-audit>=2.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "pit: point-in-time / leakage-prevention tests (must always pass, see docs/adr/0001)",
]

[tool.ruff]
line-length = 110
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's Depends()/Query()/Body() in argument defaults is the framework's
# documented, required pattern -- not the mutable-default-argument bug B008
# exists to catch.
"src/cassandra/api/**" = ["B008"]
# Same story for typer's Argument()/Option() in argument defaults.
"src/cassandra/cli/**" = ["B008"]

[tool.mypy]
python_version = "3.12"
packages = ["cassandra"]
mypy_path = "src"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
warn_redundant_casts = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
