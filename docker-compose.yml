services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cassandra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cassandra_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-cassandra}
    ports:
      - "5432:5432"
    volumes:
      - cassandra_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cassandra}"]
      interval: 5s
      timeout: 5s
      retries: 10

  engine:
    build:
      context: ./engine
    command: uvicorn cassandra.api.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cassandra}:${POSTGRES_PASSWORD:-cassandra_dev_only}@postgres:5432/${POSTGRES_DB:-cassandra}
      OPERATING_TIMEZONE: ${OPERATING_TIMEZONE:-America/New_York}
      DECISION_EDGE_THRESHOLD: ${DECISION_EDGE_THRESHOLD:-0.05}
      ADMIN_SHARED_SECRET: ${ADMIN_SHARED_SECRET:-change-me-dev-only}
      AUTO_SCHEDULER_ENABLED: ${AUTO_SCHEDULER_ENABLED:-false}
      AUTO_RUN_HOUR_LOCAL: ${AUTO_RUN_HOUR_LOCAL:-7}
    ports:
      - "8000:8000"
    volumes:
      - ./engine:/app
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./web
    # Dev-mode override (the image's default CMD is a production build) --
    # matches the engine service's --reload pattern, with source mounted
    # for live reload.
    command: pnpm run dev --port 3000
    environment:
      # Server Components (Today/Ledger) run inside this container and
      # reach the engine over the compose network by service name. The
      # Admin page's browser-side calls go through this same Next.js
      # origin via next.config.ts's rewrite, so no separate client-facing
      # URL/port is needed -- see lib/api.ts.
      API_BASE_URL: http://engine:8000
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - engine

volumes:
  cassandra_pgdata:
  web_node_modules:
